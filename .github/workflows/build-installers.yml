name: Build & Release Desktop Installers (Windows, macOS, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Phiên bản Release (VD: v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_cmd: npx electron-builder --win --x64 --publish never
          - os: macos-latest
            platform: macos
            build_cmd: npx electron-builder --mac --publish never
          - os: ubuntu-latest
            platform: linux
            build_cmd: npx electron-builder --linux --x64 --publish never

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux packaging helpers
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypt1 libfuse2t64 rpm || true

      - name: Build Next.js Static UI for Desktop
        working-directory: apps/web
        env:
          DESKTOP_EXPORT: "true"
        run: |
          npm ci
          npm run build

      - name: Copy built UI into Electron Desktop app
        run: node -e "const fs = require('fs'); fs.rmSync('apps/desktop/web-out', { recursive: true, force: true }); fs.cpSync('apps/web/out', 'apps/desktop/web-out', { recursive: true });"

      - name: Package Native Desktop Installer (${{ matrix.platform }})
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          ${{ matrix.build_cmd }}

      - name: Upload built installers (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all OS installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Full-Stack Server Portable Bundle (.zip)
        run: |
          chmod +x install-server-linux-mac.sh start.sh
          zip -r release-assets/AI-Content-Studio-FullStack-Server-1.0.0.zip . \
            -x ".git/*" "*/node_modules/*" "*/.venv/*" "*/.next/*" "*/out/*" "release-assets/*"

      - name: Verify release files
        run: ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v1.0.0' }}
          name: "AI Content Studio — Bộ Cài Đặt Máy Tính (${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v1.0.0' }})"
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## 📥 Tải Bộ Cài Đặt Chính Thức — AI Content Studio & Bộ Não Thứ 2

            Chọn đúng hệ điều hành của máy tính bạn muốn cài đặt bên dưới (không cần cài Python, Node.js hay Docker):

            ### 1. 🪟 Máy tính Windows (Windows 10 / 11 — 64-bit)
            - **`AI-Content-Studio-Setup-1.0.0.exe`** *(Khuyên dùng)*: File cài đặt chuẩn Windows. Bấm đúp để cài đặt, tự động tạo biểu tượng **AI Content Studio** ngoài màn hình Desktop & Start Menu.
            - **`AI-Content-Studio-Portable-1.0.0.exe`**: Bản chạy ngay không cần cài đặt — có thể chép vào USB để mang sang bất kỳ máy tính Windows nào mở lên dùng luôn.

            ### 2. 🍎 Máy tính macOS (MacBook / iMac)
            - **`AI-Content-Studio-macOS-arm64-1.0.0.dmg`**: Dành cho Mac chip Apple Silicon (M1 / M2 / M3 / M4).
            - **`AI-Content-Studio-macOS-x64-1.0.0.dmg`**: Dành cho Mac chip Intel.
            *(Lưu ý lần đầu mở trên macOS: Chuột phải vào biểu tượng ứng dụng -> chọn **Open**).*

            ### 3. 🐧 Máy tính Linux (Ubuntu / Debian)
            - **`AI-Content-Studio-Linux-x64-1.0.0.deb`**: Cài đặt bằng `sudo dpkg -i AI-Content-Studio-Linux-x64-1.0.0.deb`.
            - **`AI-Content-Studio-Linux-x64-1.0.0.AppImage`**: Cấp quyền chạy (`chmod +x *.AppImage`) và mở trực tiếp.

            ### 4. 🔄 Chuyển dữ liệu giữa các máy tính
            Trên thanh menu của phần mềm Desktop, vào **Tệp & Dữ liệu**:
            - Chọn **Sao lưu dữ liệu sang máy khác (.json)...** để xuất toàn bộ bài viết, kho Bộ não thứ 2, Custom Skill & Style DNA.
            - Sang máy tính mới, chọn **Khôi phục dữ liệu từ file (.json)...** để đồng bộ nguyên trạng.
