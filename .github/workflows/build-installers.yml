name: Build Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target_flags: "--win --x64"
          - os: macos-latest
            platform: macos
            target_flags: "--mac"
          - os: ubuntu-latest
            platform: linux
            target_flags: "--linux --x64"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux packaging helpers
        if: matrix.platform == 'linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libcrypt1 libfuse2t64 rpm || true

      - name: Build Next.js Static UI for Desktop
        working-directory: apps/web
        shell: bash
        env:
          DESKTOP_EXPORT: "true"
        run: |
          npm ci
          npm run build

      - name: Copy built UI into Electron Desktop app
        shell: bash
        run: |
          rm -rf apps/desktop/web-out
          cp -R apps/web/out apps/desktop/web-out

      - name: Package Native Desktop Installer
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npx electron-builder ${{ matrix.target_flags }} --publish never

      - name: Upload built installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all OS installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Full-Stack Server Bundle (.zip)
        shell: bash
        run: |
          chmod +x install-server-linux-mac.sh start.sh
          zip -r release-assets/AI-Content-Studio-FullStack-Server-1.0.0.zip . \
            -x ".git/*" "*/node_modules/*" "*/.venv/*" "*/.next/*" "*/out/*" "release-assets/*"
          ls -lh release-assets/

      - name: Create or update GitHub Release via gh CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES_FILE="/tmp/release-notes.md"
          cat << 'EOF' > "$NOTES_FILE"
          ## 📥 Tải Bộ Cài Đặt Chính Thức — AI Content Studio & Bộ Não Thứ 2

          Chọn đúng hệ điều hành của máy tính bạn muốn cài đặt bên dưới (không cần cài Python, Node.js hay Docker):

          ### 1. 🪟 Máy tính Windows (Windows 10 / 11 — 64-bit)
          - **`AI-Content-Studio-Setup-1.0.0.exe`** *(Khuyên dùng)*: File cài đặt chuẩn Windows. Bấm đúp để cài đặt, tự động tạo biểu tượng **AI Content Studio** ngoài màn hình Desktop & Start Menu.
          - **`AI-Content-Studio-Portable-1.0.0.exe`**: Bản chạy ngay không cần cài đặt — chép vào USB để mang sang bất kỳ máy tính Windows nào mở lên dùng luôn.

          ### 2. 🍎 Máy tính macOS (MacBook / iMac)
          - **`AI-Content-Studio-macOS-arm64-1.0.0.dmg`**: Dành cho Mac chip Apple Silicon (M1 / M2 / M3 / M4).
          - **`AI-Content-Studio-macOS-x64-1.0.0.dmg`**: Dành cho Mac chip Intel.

          ### 3. 🐧 Máy tính Linux (Ubuntu / Debian)
          - **`AI-Content-Studio-Linux-x64-1.0.0.deb`**: Cài đặt bằng `sudo dpkg -i AI-Content-Studio-Linux-x64-1.0.0.deb`.
          - **`AI-Content-Studio-Linux-x64-1.0.0.AppImage`**: Cấp quyền chạy (`chmod +x *.AppImage`) và mở trực tiếp.

          ### 4. 🔄 Chuyển dữ liệu giữa các máy tính
          Trên thanh menu của phần mềm Desktop, vào **Tệp & Dữ liệu** -> **Sao lưu dữ liệu sang máy khác (.json)...** để xuất toàn bộ bài viết, kho Bộ não thứ 2, Custom Skill & Style DNA sang máy mới.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "AI Content Studio — Bộ Cài Đặt Máy Tính ($TAG)" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" release-assets/* --title "AI Content Studio — Bộ Cài Đặt Máy Tính ($TAG)" --notes-file "$NOTES_FILE"
          fi
