version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: content_studio_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: content_studio
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: content_studio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  9router:
    image: node:22-alpine
    container_name: content_studio_9router
    working_dir: /app
    command: sh -c "npm install -g 9router && 9router"
    ports:
      - "20128:20128"
    volumes:
      - router_data:/root/.9router
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: content_studio_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/content_studio
      SYSTEM_9ROUTER_BASE_URL: http://9router:20128/v1
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - 9router

  web:
    build:
      context: ./apps/web
    container_name: content_studio_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  router_data:
