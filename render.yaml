databases:
  - name: content-studio-db
    plan: free
    databaseName: content_studio
    user: studio

services:
  - type: web
    name: ai-content-studio-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: content-studio-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true

  - type: web
    name: ai-content-studio-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    plan: free
    envVars:
      - key: API_BACKEND_URL
        fromService:
          type: web
          name: ai-content-studio-api
          property: hostport
